<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Player Comparison Tool (1985-2024)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏀 NBA Player Comparison</h1>
            <p class="subtitle">Compare NBA players from 1985-2024</p>
        </header>

        <div class="player-selection">
            <div class="player-select-box">
                <label for="player1Input">Player 1</label>
                <input type="text" id="player1Input" class="player-input" list="player1List" placeholder="Type or select a player...">
                <datalist id="player1List"></datalist>
            </div>

            <div class="vs-divider">VS</div>

            <div class="player-select-box">
                <label for="player2Input">Player 2</label>
                <input type="text" id="player2Input" class="player-input" list="player2List" placeholder="Type or select a player...">
                <datalist id="player2List"></datalist>
            </div>
        </div>

        <button id="compareBtn" class="compare-btn" disabled>Compare Players</button>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading player data...</p>
        </div>

        <div id="results" class="results hidden">
            <div class="winner-announcement" id="winnerBox">
                <h2>🏆 Winner</h2>
                <p id="winnerName"></p>
            </div>

            <div class="stats-comparison">
                <div class="player-stats" id="player1Stats">
                    <h3 id="player1Name"></h3>
                    <div class="score-box">
                        <div class="score-label">Overall Score</div>
                        <div class="score-value" id="player1Score"></div>
                    </div>
                    <div class="accolades-section" id="player1Accolades"></div>
                    <div class="stats-grid" id="player1StatsGrid"></div>
                    <div class="ticket-impact" id="player1Ticket"></div>
                </div>

                <div class="player-stats" id="player2Stats">
                    <h3 id="player2Name"></h3>
                    <div class="score-box">
                        <div class="score-label">Overall Score</div>
                        <div class="score-value" id="player2Score"></div>
                    </div>
                    <div class="accolades-section" id="player2Accolades"></div>
                    <div class="stats-grid" id="player2StatsGrid"></div>
                    <div class="ticket-impact" id="player2Ticket"></div>
                </div>
            </div>

            <div class="analysis-section">
                <h3>📊 Detailed Analysis</h3>
                <div id="analysisContent"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
